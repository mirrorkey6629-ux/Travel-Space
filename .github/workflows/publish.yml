name: Publish image

# Образ из main разворачивается на сервере автоматически, поэтому он сначала
# собирается и проверяется запуском, и только пройдя проверку попадает в registry.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_IMAGE: travel-space:ci

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Сборка в локальный демон, без публикации: сначала проверяем, что образ
      # действительно поднимается. tsc внутри сборки уже отсекает ошибки типов.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash .github/scripts/smoke-test.sh "$TEST_IMAGE"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action приводит имя к нижнему регистру: ghcr не принимает
          # заглавные буквы, а имя репозитория здесь с ними.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      # Слои уже в кеше после сборки выше, поэтому шаг сводится к выгрузке.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
          cache-from: type=gha
